<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monarch Café</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'DM Sans', sans-serif; background: #0e0d0b; color: #f0e8d8; overflow: hidden; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2d2a25; border-radius: 2px; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
.fade-up { animation: fadeUp 0.35s ease forwards; }
@keyframes pulse { 0%,100% { opacity:0.4; } 50% { opacity:1; } }
.sk-pulse { animation: pulse 1.4s ease-in-out infinite; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ── Design tokens ─────────────────────────────────────────────────────────────
const T = {
  bg:        '#0e0d0b',
  sidebar:   '#131210',
  card:      '#1c1917',
  cardHov:   '#221f1b',
  border:    '#2d2a25',
  accent:    '#e8a54e',
  accentDim: 'rgba(232,165,78,0.12)',
  text:      '#f0e8d8',
  muted:     '#7a6e61',
  mutedLt:   '#a09181',
};

// ── Station data ──────────────────────────────────────────────────────────────
const PHOTO_GRAD = {
  breakfast: 'linear-gradient(145deg,#7c3a1a 0%,#c2762a 45%,#e8a54e 100%)',
  soup:      'linear-gradient(145deg,#5c1a1a 0%,#9b3030 50%,#c4512a 100%)',
  main_mex:  'linear-gradient(145deg,#1a3a1a 0%,#2d6b2d 50%,#5a9a3a 100%)',
  main_ita:  'linear-gradient(145deg,#3a0f0f 0%,#7a1f1f 50%,#b03030 100%)',
  main_glo:  'linear-gradient(145deg,#0f2a3a 0%,#1a4a6a 50%,#2a7a9a 100%)',
  main_usa:  'linear-gradient(145deg,#2a1f14 0%,#5a3e28 50%,#8a6040 100%)',
  sandwich:  'linear-gradient(145deg,#3a3010 0%,#7a6020 50%,#b08030 100%)',
  pizza:     'linear-gradient(145deg,#3a1010 0%,#8a2020 50%,#c04030 100%)',
  bowl:      'linear-gradient(145deg,#1a2a10 0%,#3a5a20 50%,#6a8a40 100%)',
  default:   'linear-gradient(145deg,#1a1a1a 0%,#3a3a3a 100%)',
};
const STATION_GRAD = {
  'Breakfast Bistro':  PHOTO_GRAD.breakfast,
  'Breakfast Booster': PHOTO_GRAD.breakfast,
  'Soup of the Day':   PHOTO_GRAD.soup,
  'Platillos Latinos': PHOTO_GRAD.main_mex,
  'Viva Italia':       PHOTO_GRAD.main_ita,
  'Global Adventures': PHOTO_GRAD.main_glo,
  'Kitchen Table':     PHOTO_GRAD.main_usa,
  'Sandwich Favorite': PHOTO_GRAD.sandwich,
  'Stone Hearth Oven': PHOTO_GRAD.pizza,
  'Chef Special Bowl': PHOTO_GRAD.bowl,
};
const STATION_EMOJI = {
  'Breakfast Bistro':'🍳','Breakfast Booster':'🥞','Soup of the Day':'🥣',
  'Platillos Latinos':'🌮','Viva Italia':'🍝','Global Adventures':'🌏',
  'Kitchen Table':'🍽️','Sandwich Favorite':'🥪','Stone Hearth Oven':'🍕',
  'Chef Special Bowl':'🫙',
};

// Fixed items — verbatim from PDF
const OUTDOOR_FIXED = [
  { name:'Niman Ranch Cheeseburger on a Brioche Bun',
    desc:'Lettuce, Tomato, Pickles, Onions, Kettle Chips', price:'$7.75' },
  { name:'Burrito Wrap or Bowl',
    desc:'Vegetarian or Grilled Free Range Chicken, Spanish Rice, Refried Beans, Shredded Lettuce, Cheese, Salsa Fresca, Sour Cream, Tortilla Chips', price:'$8.00/$8.25' },
  { name:'House Made Three Cheese, Pepperoni or Pizza of the Day', price:'$5.50' },
  { name:'Crispy Chicken Wings, JoJo Potatoes, Ranch Dressing', price:'$8.00' },
];
const ALL_DAY = [
  { name:'Traditional Caesar Salad', desc:'Shaved Parmesan & Garlicky Croutons', price:'$7.00' },
  { name:'Traditional Grilled Chicken Caesar Salad', desc:'Shaved Parmesan, Garlicky Croutons', price:'$7.75' },
  { name:'House Turkey & Provolone Cheese Sandwich', desc:'Crisp Shaved Iceberg, Pepperoncini Slices, Mayonnaise, Italian Dressing & Chips', price:'$7.75' },
  { name:'The Very-Veggie Sandwich', desc:'Wild Summer Greens, Jack Cheese, Guacamole Spread, Cucumber, Tomato on Ciabatta Bread', price:'$7.75' },
  { name:'Protein Pack', desc:'Free-Range Grilled Chicken, Hummus, Carrots, Snap Peas, Naan Bread', price:'$7.75' },
];
const HOURS_DATA = [
  { s:'Breakfast',     t:'7:15 AM – 10:40 AM' },
  { s:'Lunch',         t:'11:00 AM – 1:30 PM' },
  { s:'Faculty Lunch', t:'10:45 AM – 1:30 PM' },
  { s:'Snack Bar',     t:'1:30 PM – 3:30 PM' },
];

// ── Hours status ──────────────────────────────────────────────────────────────
function getStatus() {
  const m = new Date().getHours()*60 + new Date().getMinutes();
  if (m < 7*60+15)   return { label:'Opening at 7:15', color:T.muted };
  if (m < 10*60+40)  return { label:'Breakfast · Open', color:'#6fcf97' };
  if (m < 11*60)     return { label:'Lunch soon', color:T.accent };
  if (m < 13*60+30)  return { label:'Lunch · Open', color:'#6fcf97' };
  if (m < 15*60+30)  return { label:'Snack Bar · Open', color:'#6fcf97' };
  return               { label:'Closed', color:'#eb5757' };
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function el(tag, props, ...children) {
  const node = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
      else if (k === 'onclick') node.onclick = v;
      else if (k === 'onmouseenter') node.onmouseenter = v;
      else if (k === 'onmouseleave') node.onmouseleave = v;
      else if (k === 'className') node.className = v;
      else node.setAttribute(k, v);
    }
  }
  for (const c of children) {
    if (c == null) continue;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return node;
}
function css(node, styles) { Object.assign(node.style, styles); return node; }

// ── Grain SVG data URI ────────────────────────────────────────────────────────
const GRAIN = `url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")`;

// ── Build food photo element ──────────────────────────────────────────────────
function makeFoodPhoto(station, height) {
  const grad  = STATION_GRAD[station] || PHOTO_GRAD.default;
  const emoji = STATION_EMOJI[station] || '🍴';
  const wrap  = el('div', { style:{
    background:grad, height:height+'px', borderRadius:'12px',
    display:'flex', alignItems:'center', justifyContent:'center',
    position:'relative', overflow:'hidden',
  }});
  const grain = el('div', { style:{
    position:'absolute', inset:'0', opacity:'0.18',
    backgroundImage:GRAIN, backgroundSize:'200px',
  }});
  const fade  = el('div', { style:{
    position:'absolute', bottom:'0', left:'0', right:'0', height:'60%',
    background:'linear-gradient(to top, rgba(14,13,11,0.7), transparent)',
  }});
  const icon  = el('span', { style:{
    fontSize:'3rem', filter:'drop-shadow(0 4px 12px rgba(0,0,0,0.5))',
    position:'relative', zIndex:'1',
  }}, emoji);
  wrap.appendChild(grain);
  wrap.appendChild(fade);
  wrap.appendChild(icon);
  return wrap;
}

// ── State ─────────────────────────────────────────────────────────────────────
let state = {
  days:      [],
  activeDay: 0,
  selected:  null,
  loading:   true,
  error:     null,
  weekLabel: 'Archbishop Mitty High School',
  status:    getStatus(),
};

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const root = document.getElementById('app');
  root.innerHTML = '';

  const app = el('div', { style:{
    display:'flex', height:'100vh', overflow:'hidden', background:T.bg,
  }});

  // ── Sidebar ──
  const sidebarEl = buildSidebar();
  app.appendChild(sidebarEl);

  // ── Right panel ──
  const right = el('div', { style:{
    flex:'1', display:'flex', overflow:'hidden', position:'relative',
  }});

  if (state.loading) {
    right.appendChild(buildSkeleton());
  } else if (state.error) {
    right.appendChild(buildError());
  } else {
    const day = state.days[state.activeDay];
    if (state.selected) {
      right.appendChild(buildDetail(state.selected));
      const backBtn = el('button', {
        style:{
          position:'absolute', top:'20px', right:'24px',
          background:T.card, border:`1px solid ${T.border}`,
          color:T.muted, borderRadius:'20px', padding:'6px 16px',
          fontSize:'0.78rem', cursor:'pointer', fontFamily:'inherit', zIndex:'10',
        },
        onclick: () => { state.selected = null; render(); },
      }, '← Back');
      right.appendChild(backBtn);
    } else {
      right.appendChild(buildCardGrid(day));
    }
  }

  app.appendChild(right);
  root.appendChild(app);
}

// ── Sidebar ───────────────────────────────────────────────────────────────────
function buildSidebar() {
  const sidebar = el('div', { style:{
    width:'280px', flexShrink:'0', background:T.sidebar,
    display:'flex', flexDirection:'column',
    borderRight:`1px solid ${T.border}`, height:'100%',
  }});

  // Wordmark
  const statusColor = state.status.color;
  const statusBg    = statusColor === '#6fcf97'  ? 'rgba(111,207,151,0.12)'
                    : statusColor === T.accent    ? 'rgba(232,165,78,0.12)'
                    :                               'rgba(122,110,97,0.15)';
  const header = el('div', { style:{ padding:'32px 24px 24px' }},
    el('div', { style:{ fontFamily:"'Playfair Display',serif", fontSize:'1.4rem',
      fontWeight:'600', color:T.text, letterSpacing:'-0.01em' }}, 'Monarch Café'),
    el('div', { style:{ fontSize:'0.72rem', color:T.muted, marginTop:'4px',
      letterSpacing:'0.04em' }}, state.weekLabel),
    el('div', { style:{ marginTop:'14px', display:'inline-flex', alignItems:'center',
      gap:'6px', padding:'5px 12px', borderRadius:'20px', background:statusBg }},
      el('span', { style:{ width:'6px', height:'6px', borderRadius:'50%',
        background:statusColor, display:'inline-block', flexShrink:'0' }}),
      el('span', { style:{ fontSize:'0.72rem', fontWeight:'500', color:statusColor }},
        state.status.label),
    ),
  );
  sidebar.appendChild(header);

  // Day tabs
  const tabsWrap = el('div', { style:{ padding:'0 16px', display:'flex', gap:'6px' }});
  state.days.forEach((day, i) => {
    const isActive = i === state.activeDay;
    const btn = el('button', {
      style:{
        flex:'1', padding:'8px 4px', borderRadius:'8px', border:'none',
        background: isActive ? T.accent : T.card,
        color: isActive ? T.bg : T.muted,
        fontSize:'0.7rem', fontWeight:'500', cursor:'pointer', fontFamily:'inherit',
        transition:'all 0.15s', position:'relative',
      },
      onclick: () => { state.activeDay = i; state.selected = null; render(); },
    }, day.name.slice(0,3) + ' ' + day.date.replace(/\w+ (\d+), \d+/, '$1'));
    if (day.holiday) {
      btn.appendChild(el('span', { style:{
        position:'absolute', top:'4px', right:'4px', width:'4px', height:'4px',
        borderRadius:'50%', background: isActive ? T.bg : T.accent, opacity:'0.7',
      }}));
    }
    tabsWrap.appendChild(btn);
  });
  sidebar.appendChild(tabsWrap);

  // Date label
  if (state.days.length) {
    const d = state.days[state.activeDay];
    sidebar.appendChild(el('div', { style:{
      padding:'14px 20px 10px', fontSize:'0.72rem', color:T.muted,
      fontWeight:'500', letterSpacing:'0.06em', textTransform:'uppercase',
    }}, d.name + ' · ' + d.date.replace(/(\w+) (\d+), \d+/, '$1 $2')));
  }

  // Station list
  const list = el('div', { style:{
    flex:'1', overflowY:'auto', padding:'0 12px 24px',
  }});

  const items = state.days[state.activeDay]?.items || [];
  if (items.length === 0 && !state.loading) {
    list.appendChild(el('div', { style:{
      padding:'20px 8px', fontSize:'0.82rem', color:T.muted,
      fontStyle:'italic', fontFamily:"'Playfair Display',serif",
    }}, state.days[state.activeDay]?.holiday ? 'School holiday' : 'No items today'));
  } else {
    items.forEach(item => {
      const isSel = state.selected?.station === item.station;
      const row = el('div', {
        style:{
          display:'flex', alignItems:'center', gap:'12px', padding:'11px 12px',
          borderRadius:'10px', cursor:'pointer', marginBottom:'2px',
          background: isSel ? T.accentDim : 'transparent',
          border:`1px solid ${isSel ? T.accent+'44' : 'transparent'}`,
          transition:'all 0.15s',
        },
        onclick: () => { state.selected = item; render(); },
      },
        el('span', { style:{ fontSize:'1.1rem', flexShrink:'0' }},
          STATION_EMOJI[item.station] || '🍴'),
        el('div', { style:{ flex:'1', minWidth:'0' }},
          el('div', { style:{
            fontSize:'0.8rem', fontWeight:'500',
            color: isSel ? T.text : T.mutedLt,
            whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis',
          }}, item.station),
          el('div', { style:{ fontSize:'0.7rem', color:T.muted, marginTop:'1px' }},
            item.price || ''),
        ),
        isSel ? el('span', { style:{ color:T.accent, fontSize:'0.8rem' }}, '›') : null,
      );
      list.appendChild(row);
    });
  }
  sidebar.appendChild(list);
  return sidebar;
}

// ── Card grid ─────────────────────────────────────────────────────────────────
function buildCardGrid(day) {
  if (day.holiday) return buildHoliday();

  const wrap = el('div', { className:'fade-up', style:{
    flex:'1', overflowY:'auto', padding:'32px 32px 40px', background:T.bg,
  }});

  wrap.appendChild(el('div', { style:{ marginBottom:'24px' }},
    el('h1', { style:{ fontFamily:"'Playfair Display',serif", fontSize:'1.6rem',
      fontWeight:'600', color:T.text }}, "Today's Menu"),
    el('p',  { style:{ fontSize:'0.82rem', color:T.muted, marginTop:'6px' }},
      'Select a station to see details'),
  ));

  const grid = el('div', { style:{
    display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:'16px',
  }});

  day.items.forEach(item => {
    const card = el('div', {
      style:{
        background:'transparent', border:`1px solid ${T.border}`,
        borderRadius:'14px', cursor:'pointer', overflow:'hidden',
        transition:'all 0.18s ease',
      },
      onclick: () => { state.selected = item; render(); },
    });
    card.onmouseenter = () => { card.style.background = T.cardHov; };
    card.onmouseleave = () => { card.style.background = 'transparent'; };

    card.appendChild(makeFoodPhoto(item.station, 140));

    const body = el('div', { style:{ padding:'14px 16px 16px' }},
      el('div', { style:{ fontSize:'0.7rem', fontWeight:'500', color:T.accent,
        textTransform:'uppercase', letterSpacing:'0.1em', marginBottom:'5px' }},
        item.station),
      el('div', { style:{ fontSize:'0.85rem', color:T.text, lineHeight:'1.45',
        display:'-webkit-box', WebkitLineClamp:'2', WebkitBoxOrient:'vertical',
        overflow:'hidden' }}, item.description || item.desc || ''),
      el('div', { style:{ marginTop:'10px', display:'flex',
        justifyContent:'space-between', alignItems:'center' }},
        el('span', { style:{ fontSize:'0.8rem', fontWeight:'500', color:T.mutedLt,
          background:T.accentDim, padding:'3px 10px', borderRadius:'20px' }},
          item.category || item.cat || ''),
        el('span', { style:{ fontFamily:"'Playfair Display',serif", fontSize:'1rem',
          fontWeight:'600', color:T.accent }}, item.price || ''),
      ),
    );
    card.appendChild(body);
    grid.appendChild(card);
  });

  wrap.appendChild(grid);
  return wrap;
}

// ── Detail panel ──────────────────────────────────────────────────────────────
function buildDetail(item) {
  const panel = el('div', { className:'fade-up', style:{
    flex:'1', overflowY:'auto', padding:'40px 40px 40px 32px',
  }});

  panel.appendChild(makeFoodPhoto(item.station, 280));

  const info = el('div', { style:{ marginTop:'28px' }});
  info.appendChild(el('div', { style:{ fontSize:'0.7rem', fontWeight:'500', color:T.accent,
    textTransform:'uppercase', letterSpacing:'0.12em', marginBottom:'10px' }},
    (item.category || item.cat || '') + ' · Today'));
  info.appendChild(el('h2', { style:{ fontFamily:"'Playfair Display',serif",
    fontSize:'1.9rem', fontWeight:'600', color:T.text, lineHeight:'1.2', marginBottom:'14px' }},
    item.station));
  info.appendChild(el('p', { style:{ fontSize:'1rem', color:T.mutedLt,
    lineHeight:'1.7', marginBottom:'28px' }},
    item.description || item.desc || ''));
  info.appendChild(el('div', { style:{ display:'flex', alignItems:'center', gap:'16px',
    paddingTop:'20px', borderTop:`1px solid ${T.border}` }},
    el('span', { style:{ fontFamily:"'Playfair Display',serif", fontSize:'2rem',
      fontWeight:'600', color:T.accent }}, item.price || ''),
    el('span', { style:{ fontSize:'0.8rem', color:T.muted }}, 'Available during service hours'),
  ));
  panel.appendChild(info);

  // Always available
  panel.appendChild(buildListSection('Always Available · Outdoor Windows', OUTDOOR_FIXED));

  // All day
  panel.appendChild(buildListSection('All Day Menu', ALL_DAY, { marginTop:'0' }));

  // Hours
  const hoursSection = el('div', { style:{ marginTop:'36px', marginBottom:'40px' }});
  hoursSection.appendChild(el('div', { style:{ fontSize:'0.65rem', fontWeight:'500',
    color:T.muted, textTransform:'uppercase', letterSpacing:'0.12em', marginBottom:'16px' }},
    'Service Hours'));
  const grid = el('div', { style:{ display:'grid',
    gridTemplateColumns:'1fr 1fr', gap:'10px 24px' }});
  HOURS_DATA.forEach(h => {
    grid.appendChild(el('div', { style:{ fontSize:'0.85rem' }},
      el('span', { style:{ color:T.text, fontWeight:'500', display:'block' }}, h.s),
      el('span', { style:{ color:T.muted, fontSize:'0.78rem', marginTop:'2px',
        display:'block' }}, h.t),
    ));
  });
  hoursSection.appendChild(grid);
  panel.appendChild(hoursSection);

  return panel;
}

function buildListSection(title, items, extraStyle) {
  const wrap = el('div', { style:{ marginTop:'36px', ...(extraStyle||{}) }});
  wrap.appendChild(el('div', { style:{ fontSize:'0.65rem', fontWeight:'500',
    color:T.muted, textTransform:'uppercase', letterSpacing:'0.12em', marginBottom:'16px' }},
    title));
  items.forEach(f => {
    const row = el('div', { style:{ display:'flex', justifyContent:'space-between',
      alignItems:'flex-start', gap:'16px', padding:'12px 0',
      borderBottom:`1px solid ${T.border}` }});
    const left = el('div', null,
      el('div', { style:{ fontSize:'0.875rem', fontWeight:'500', color:T.text }}, f.name));
    if (f.desc) left.appendChild(
      el('div', { style:{ fontSize:'0.8rem', color:T.muted, marginTop:'3px' }}, f.desc));
    row.appendChild(left);
    row.appendChild(el('span', { style:{ fontFamily:"'Playfair Display',serif",
      fontSize:'0.9rem', color:T.accent, flexShrink:'0', fontWeight:'600' }}, f.price));
    wrap.appendChild(row);
  });
  return wrap;
}

// ── Holiday ───────────────────────────────────────────────────────────────────
function buildHoliday() {
  return el('div', { style:{
    flex:'1', display:'flex', flexDirection:'column', alignItems:'center',
    justifyContent:'center', gap:'16px',
  }},
    el('div', { style:{ fontSize:'4rem' }}, '🎉'),
    el('h2',  { style:{ fontFamily:"'Playfair Display',serif", fontSize:'1.6rem',
      fontWeight:'600', color:T.text }}, 'No School Today'),
    el('p',   { style:{ color:T.muted, fontSize:'0.9rem' }},
      'Enjoy your day off — the café will be back next school day.'),
  );
}

// ── Skeleton ──────────────────────────────────────────────────────────────────
function buildSkeleton() {
  const wrap = el('div', { style:{ flex:'1', padding:'32px 32px 40px' }});
  const card = el('div', { className:'sk-pulse', style:{
    background:T.card, border:`1px solid ${T.border}`, borderRadius:'12px',
    padding:'24px',
  }});
  [[35],[80],[65],[75],[55]].forEach(([w], i) => {
    card.appendChild(el('div', { style:{
      height:'13px', borderRadius:'6px', background:T.border,
      width:w+'%', marginBottom:'10px', marginTop: i===3 ? '16px' : '0',
    }}));
  });
  wrap.appendChild(card);
  return wrap;
}

// ── Error ─────────────────────────────────────────────────────────────────────
function buildError() {
  return el('div', { style:{
    flex:'1', display:'flex', flexDirection:'column',
    alignItems:'center', justifyContent:'center', gap:'16px', padding:'40px',
  }},
    el('p', { style:{ color:'#eb5757', fontSize:'0.9rem', textAlign:'center' }},
      '⚠️ ' + state.error),
    el('button', {
      style:{ padding:'8px 20px', borderRadius:'8px', border:`1px solid ${T.border}`,
        background:T.card, color:T.text, fontFamily:'inherit',
        fontSize:'0.875rem', fontWeight:'500', cursor:'pointer' },
      onclick: loadMenu,
    }, 'Try again'),
  );
}

// ── Today index ───────────────────────────────────────────────────────────────
function todayIndex(days) {
  const name = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date().getDay()];
  const i = days.findIndex(d => d.name === name);
  return i >= 0 ? i : 0;
}

// ── Load menu from API ────────────────────────────────────────────────────────
async function loadMenu() {
  state.loading = true;
  state.error   = null;
  render();
  try {
    const res = await fetch('/api/menu');
    if (!res.ok) throw new Error('Server error ' + res.status);
    const data = await res.json();
    if (!data.days?.length) throw new Error("No menu data in this week's PDF.");
    state.days      = data.days;
    state.activeDay = todayIndex(data.days);
    const first = data.days[0], last = data.days[data.days.length-1];
    state.weekLabel = 'Week of ' + first.date + ' – ' + last.date.replace(/\w+ /, '');
    state.loading   = false;
    render();
  } catch(err) {
    state.error   = err.message;
    state.loading = false;
    render();
  }
}

// ── Boot ──────────────────────────────────────────────────────────────────────
setInterval(() => { state.status = getStatus(); render(); }, 60000);
loadMenu();
</script>
</body>
</html>
