// ── Hours status ──────────────────────────────────────────────────────────────
function getStatus() {
  const m = new Date().getHours()*60 + new Date().getMinutes();
  if (m < 7*60+15)   return { label:'Opening at 7:15', color:T.muted };
  if (m < 10*60+40)  return { label:'Breakfast · Open', color:'#6fcf97' };
  if (m < 11*60)     return { label:'Lunch soon', color:T.accent };
  if (m < 13*60+30)  return { label:'Lunch · Open', color:'#6fcf97' };
  if (m < 15*60+30)  return { label:'After School Snack · Open', color:'#6fcf97' };
  return               { label:'Closed', color:'#eb5757' };
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function el(tag, props, ...children) {
  const node = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
      else if (k === 'onclick') node.onclick = v;
      else if (k === 'onmouseenter') node.onmouseenter = v;
      else if (k === 'onmouseleave') node.onmouseleave = v;
      else if (k === 'className') node.className = v;
      else node.setAttribute(k, v);
    }
  }
  for (const c of children) {
    if (c == null) continue;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return node;
}
function css(node, styles) { Object.assign(node.style, styles); return node; }

// ── Grain SVG data URI ────────────────────────────────────────────────────────
const GRAIN = `url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")`;

// ── Build food photo element ──────────────────────────────────────────────────
function makeFoodPhoto(station, height) {
  const photoUrl = STATION_PHOTOS[station]?.main;
  const wrap     = el('div', { style:{
    height:height+'px', borderRadius:'12px',
    display:'flex', alignItems:'center', justifyContent:'center',
    position:'relative', overflow:'hidden',
    background: photoUrl ? '#000' : (STATION_GRAD[station] || PHOTO_GRAD.default),
  }});

  if (photoUrl) {
    const img = el('img', { style:{
      position:'absolute', inset:'0', width:'100%', height:'100%',
      objectFit:'cover', opacity:'0.85',
    }});
    img.src = photoUrl;
    wrap.appendChild(img);
  } else {
    const grain = el('div', { style:{
      position:'absolute', inset:'0', opacity:'0.18',
      backgroundImage:GRAIN, backgroundSize:'200px',
    }});
    const icon = el('span', { style:{
      fontSize:'3rem', filter:'drop-shadow(0 4px 12px rgba(0,0,0,0.5))',
      position:'relative', zIndex:'1',
    }}, STATION_EMOJI[station] || '🍴');
    wrap.appendChild(grain);
    wrap.appendChild(icon);
  }

  const fade = el('div', { style:{
    position:'absolute', bottom:'0', left:'0', right:'0', height:'60%',
    background:'linear-gradient(to top, rgba(14,13,11,0.85), transparent)',
    zIndex:'1',
  }});
  wrap.appendChild(fade);
  return wrap;
}

// ── Station photos (loaded from station-photos.json, falls back to gradient) ──
let STATION_PHOTOS = {};
function loadPhotos() {
  const day = state.days[state.activeDay]?.name || '';
  fetch('/api/photos?day=' + encodeURIComponent(day))
    .then(r => r.ok ? r.json() : {})
    .then(d => { STATION_PHOTOS = d; if (!state.loading) render(); })
    .catch(() => {});
}

// ── State ─────────────────────────────────────────────────────────────────────
function isWeekend() {
  const now = new Date();
  const d = now.getDay();
  const m = now.getHours() * 60 + now.getMinutes();
  return d === 0 || d === 6 || (d === 5 && m >= 15 * 60 + 30);
}

let state = {
  days:             [],
  activeDay:        0,
  selected:         null,
  selectedOutdoor:  null,
  loading:          true,
  error:            null,
  weekLabel:        'Archbishop Mitty High School',
  status:           getStatus(),
  ratings:          {},
  weekendDismissed: false,
  holidayDismissed: false,
};

// ── Render ────────────────────────────────────────────────────────────────────
let _renderPending = false;
function render() {
  if (_renderPending) return;
  _renderPending = true;
  requestAnimationFrame(() => {
    _renderPending = false;
    const root = document.getElementById('app');

    const app = el('div', { style:{
      display:'flex', height:'100vh', overflow:'hidden', background:T.bg,
    }});

    app.appendChild(buildSidebar());

    const right = el('div', { style:{
      flex:'1', display:'flex', overflow:'hidden', position:'relative',
    }});

    if (state.loading) {
      right.appendChild(buildSkeleton());
    } else if (state.error) {
      right.appendChild(buildError());
    } else {
      const day = state.days[state.activeDay];
      right.appendChild(buildCardGrid(day));
      if (state.selected) app.appendChild(buildModal(state.selected));
    }

    app.appendChild(right);

    const nodes = [app];
    if (state.selectedOutdoor) nodes.push(buildOutdoorModal(state.selectedOutdoor));
    if (isWeekend() && !state.weekendDismissed) nodes.push(buildWeekendModal());
    if (isTodayHoliday() && !state.holidayDismissed) nodes.push(buildHolidayModal());

    root.replaceChildren(...nodes);
  });
}

// ── Holiday check ─────────────────────────────────────────────────────────────
function isTodayHoliday() {
  if (!state.days.length) return false;
  const name = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date().getDay()];
  const today = state.days.find(d => d.name === name);
  return today?.holiday === true;
}

// ── Sidebar ───────────────────────────────────────────────────────────────────
function buildSidebar() {
  const sidebar = el('div', { style:{
    width:'280px', flexShrink:'0', background:T.sidebar,
    display:'flex', flexDirection:'column',
    borderRight:`1px solid ${T.border}`, height:'100%',

  // Wordmark

  const statusBg    = statusColor === '#6fcf97'  ? 'rgba(111,207,151,0.12)'
                    : statusColor === T.accent    ? 'rgba(232,165,78,0.12)'
                    :                               'rgba(122,110,97,0.15)';
  const header = el('div', { style:{ padding:'32px 24px 24px' }},
    el('div', { style:{ fontFamily:"'Playfair Display',serif", fontSize:'1.4rem',
      fontWeight:'600', color:T.text, letterSpacing:'-0.01em', cursor:'pointer' },
      onclick: () => { state.selected = null; render(); },
    }, 'Monarch Café'),
    el('div', { style:{ fontSize:'0.72rem', color:T.muted, marginTop:'4px',
      letterSpacing:'0.04em' }}, state.weekLabel),
    el('div', { style:{ marginTop:'14px', display:'inline-flex', alignItems:'center',
      gap:'6px', padding:'5px 12px', borderRadius:'20px', background:statusBg }},
      el('span', { style:{ width:'6px', height:'6px', borderRadius:'50%',
        background:statusColor, display:'inline-block', flexShrink:'0' }}),
      el('span', { style:{ fontSize:'0.72rem', fontWeight:'500', color:statusColor }},
        state.status.label),
    ),
  );
  sidebar.appendChild(header);

  // Day tabs
  const tabsWrap = el('div', { style:{ padding:'0 16px', display:'flex', gap:'6px' }});
  state.days.forEach((day, i) => {
    const isActive = i === state.activeDay;
    const btn = el('button', {
      style:{
        flex:'1', padding:'8px 4px', borderRadius:'8px', border:'none',
        background: isActive ? T.accent : T.card,
        color: isActive ? T.bg : T.muted,
        fontSize:'0.7rem', fontWeight:'500', cursor:'pointer', fontFamily:'inherit',
        transition:'all 0.15s', position:'relative',
      },
      onclick: () => { state.activeDay = i; state.selected = null; render(); loadPhotos(); },
    }, day.name.slice(0,3) + ' ' + day.date.replace(/\w+ (\d+), \d+/, '$1'));
    if (day.holiday) {
      btn.appendChild(el('span', { style:{
        position:'absolute', top:'4px', right:'4px', width:'4px', height:'4px',
        borderRadius:'50%', background: isActive ? T.bg : T.accent, opacity:'0.7',
      }}));
    }
    tabsWrap.appendChild(btn);
  });
  sidebar.appendChild(tabsWrap);

  // Date label
  if (state.days.length) {
    const d = state.days[state.activeDay];
    sidebar.appendChild(el('div', { style:{
      padding:'14px 20px 10px', fontSize:'0.72rem', color:T.muted,
      fontWeight:'500', letterSpacing:'0.06em', textTransform:'uppercase',
      whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis',
    }}, d.name + ' · ' + d.date.replace(/(\w+) (\d+), \d+/, '$1 $2')));
  }

  // Station list
  const list = el('div', { style:{
    flex:'1', overflowY:'auto', padding:'0 12px 24px',
  }});

  const items = state.days[state.activeDay]?.items || [];
  if (items.length === 0 && !state.loading) {
    list.appendChild(el('div', { style:{
      padding:'20px 8px', fontSize:'0.82rem', color:T.muted,
      fontStyle:'italic', fontFamily:"'Playfair Display',serif",
    }}, state.days[state.activeDay]?.holiday ? 'School holiday' : 'No items today'));
  } else {
    items.forEach(item => {
      const isSel = state.selected?.station === item.station;
      const row = el('div', {
        style:{
          display:'flex', alignItems:'center', gap:'12px', padding:'11px 12px',
          borderRadius:'10px', cursor:'pointer', marginBottom:'2px',
          background: isSel ? T.accentDim : 'transparent',
          border:`1px solid ${isSel ? T.accent+'44' : 'transparent'}`,
          transition:'all 0.15s',
        },
        onclick: () => { state.selected = item; render(); },
      },
        el('span', { style:{ fontSize:'1.1rem', flexShrink:'0' }},
          STATION_EMOJI[item.station] || '🍴'),
        el('div', { style:{ flex:'1', minWidth:'0' }},
          el('div', { style:{
            fontSize:'0.8rem', fontWeight:'500',
            color: isSel ? T.text : T.mutedLt,
            whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis',
          }}, item.station),
          el('div', { style:{ fontSize:'0.7rem', color:T.muted, marginTop:'1px' }},
            item.price || ''),
        ),
        isSel ? el('span', { style:{ color:T.accent, fontSize:'0.8rem' }}, '›') : null,
      );
      list.appendChild(row);
    });
  }
  sidebar.appendChild(list);

  // Outdoor everyday items
  const outdoorSection = el('div', { style:{
    borderTop:`1px solid ${T.border}`, padding:'14px 12px 20px', flexShrink:'0',
  }});
  outdoorSection.appendChild(el('div', { style:{
    fontSize:'0.62rem', fontWeight:'500', color:T.muted,
    textTransform:'uppercase', letterSpacing:'0.1em', marginBottom:'10px', paddingLeft:'4px',
  }}, 'Outdoor Window · Everyday'));
  OUTDOOR_FIXED.forEach(item => {
    const row = el('div', {
      style:{
        display:'flex', justifyContent:'space-between', alignItems:'flex-start',
        gap:'8px', padding:'7px 4px', borderBottom:`1px solid ${T.border+'88'}`,
        cursor:'pointer', borderRadius:'6px', transition:'background 0.15s',
      },
      onclick: () => { state.selectedOutdoor = item; render(); },
      onmouseenter: (e) => { e.currentTarget.style.background = T.accentDim; },
      onmouseleave: (e) => { e.currentTarget.style.background = 'transparent'; },
    });
    row.appendChild(el('div', { style:{ flex:'1', minWidth:'0' }},
      el('div', { style:{
        fontSize:'0.75rem', color:T.mutedLt, fontWeight:'500',
        lineHeight:'1.3',
      }}, item.name),
      item.desc ? el('div', { style:{
        fontSize:'0.67rem', color:T.muted, marginTop:'2px', lineHeight:'1.3',
      }}, item.desc) : null,
    ));
    row.appendChild(el('span', { style:{
      fontFamily:"'Playfair Display',serif", fontSize:'0.78rem',
      color:T.accent, flexShrink:'0', fontWeight:'600',
    }}, item.price));
    outdoorSection.appendChild(row);
  });
  sidebar.appendChild(outdoorSection);

  return sidebar;
}

// ── Card grid ─────────────────────────────────────────────────────────────────
function buildCardGrid(day) {
  if (day.holiday) return buildHoliday();

  const wrap = el('div', { className:'fade-up', style:{
    flex:'1', overflowY:'auto', padding:'28px 28px 40px', background:T.bg,
  }});

  wrap.appendChild(el('div', { style:{ marginBottom:'24px' }},
    el('h1', { style:{ fontFamily:"'Playfair Display',serif", fontSize:'1.6rem',
      fontWeight:'600', color:T.text }}, "Today's Menu"),
    el('p',  { style:{ fontSize:'0.82rem', color:T.muted, marginTop:'4px' }},
      'Select a station to see details'),
  ));

  const breakfastItems = day.items.filter(i => i.category === 'breakfast');
  const lunchItems     = day.items.filter(i => i.category !== 'breakfast');

  const m = new Date().getHours() * 60 + new Date().getMinutes();
  const breakfastFirst = m < 10 * 60 + 40;
  const sections = breakfastFirst
    ? [['Breakfast', breakfastItems], ['Lunch', lunchItems]]
    : [['Lunch', lunchItems], ['Breakfast', breakfastItems]];

  sections.forEach(([label, items], si) => {
    if (!items.length) return;

    const section = el('div', { style:{ marginBottom:'24px' }});
    section.appendChild(el('div', { style:{
      fontSize:'0.65rem', fontWeight:'600', color:T.muted,
      textTransform:'uppercase', letterSpacing:'0.1em',
      marginBottom:'12px', marginTop: si === 0 ? '0' : '8px',
      paddingBottom:'8px', borderBottom:`1px solid ${T.border}`,
    }}, label));

    const grid = el('div', { style:{
      display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:'14px',
    }});

    items.forEach(item => {
    // Full-bleed photo card — text overlaid on the image
    const card = el('div', {
      style:{
        position:'relative', borderRadius:'14px', cursor:'pointer',
        overflow:'hidden', height:'220px', border:`1px solid ${T.border}`,
        transition:'transform 0.18s ease, box-shadow 0.18s ease',
      },
      onclick: () => { state.selected = item; render(); },
    });
    card.onmouseenter = () => {
      card.style.transform = 'scale(1.02)';
      card.style.boxShadow = '0 8px 32px rgba(0,0,0,0.5)';
    };
    card.onmouseleave = () => {
      card.style.transform = 'scale(1)';
      card.style.boxShadow = 'none';
    };

    // Background: real photo or gradient
    const photoUrl = STATION_PHOTOS[item.station]?.main;
    if (photoUrl) {
      const img = el('img', { style:{
        position:'absolute', inset:'0', width:'100%', height:'100%',

// ── Photo carousel (used in modal when multiple photos exist) ─────────────────
function buildPhotoCarousel(station, height, extraStyles) {
  const data    = STATION_PHOTOS[station];
  const gallery = data?.gallery || (data?.main ? [data.main] : []);

  if (gallery.length <= 1) {
    const wrap = makeFoodPhoto(station, height);
    if (extraStyles) css(wrap, extraStyles);
    return wrap;
  }

  let current = 0;

  const wrap = el('div', { style:{
    position:'relative', height:height+'px', overflow:'hidden',
    ...(extraStyles || {}),
  }});

  const imgEl = el('img', { style:{
    position:'absolute', inset:'0', width:'100%', height:'100%', objectFit:'cover',
  }});
  imgEl.src = gallery[0];
  wrap.appendChild(imgEl);

  wrap.appendChild(el('div', { style:{
    position:'absolute', inset:'0',
    background:'linear-gradient(to top, rgba(14,13,11,0.85), transparent)',
    zIndex:'1',
  }}));

  const counter = el('div', { style:{
    position:'absolute', top:'10px', left:'10px', zIndex:'3',
    background:'rgba(0,0,0,0.55)', borderRadius:'20px', padding:'3px 10px',
    fontSize:'0.72rem', color:T.text,
  }}, `1 / ${gallery.length}`);
  wrap.appendChild(counter);

  const dotsWrap = el('div', { style:{
    position:'absolute', bottom:'12px', left:'0', right:'0',
    display:'flex', justifyContent:'center', gap:'6px', zIndex:'3',
  }});
  const dots = gallery.map((_, i) => {
    const dot = el('div', { style:{
      width:'6px', height:'6px', borderRadius:'50%', cursor:'pointer',
      background: i === 0 ? T.accent : 'rgba(255,255,255,0.35)',
      transition:'background 0.2s',
    }});
    dot.onclick = (e) => { e.stopPropagation(); goTo(i); };
    return dot;
  });
  dots.forEach(d => dotsWrap.appendChild(d));
  wrap.appendChild(dotsWrap);

  const btnStyle = {
    position:'absolute', top:'50%', transform:'translateY(-50%)', zIndex:'3',
    width:'32px', height:'32px', borderRadius:'50%',
    background:'rgba(14,13,11,0.65)', border:`1px solid ${T.border}`,
    color:T.text, fontSize:'1.2rem', cursor:'pointer', fontFamily:'inherit',
    display:'flex', alignItems:'center', justifyContent:'center',
  };
  const prevBtn = el('button', { style:{ ...btnStyle, left:'10px' }},  '‹');
  const nextBtn = el('button', { style:{ ...btnStyle, right:'10px' }}, '›');
  prevBtn.onclick = (e) => { e.stopPropagation(); goTo(current - 1); };
  nextBtn.onclick = (e) => { e.stopPropagation(); goTo(current + 1); };
  wrap.appendChild(prevBtn);
  wrap.appendChild(nextBtn);

  function goTo(i) {
    current = (i + gallery.length) % gallery.length;
    imgEl.src = gallery[current];
    counter.textContent = `${current + 1} / ${gallery.length}`;
    dots.forEach((d, j) => {
      d.style.background = j === current ? T.accent : 'rgba(255,255,255,0.35)';
    });
  }

  return wrap;
}

// ── Today index ───────────────────────────────────────────────────────────────
function todayIndex(days) {
  const name = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date().getDay()];
  const i = days.findIndex(d => d.name === name);
  return i >= 0 ? i : 0;
}

// ── Load menu from API ────────────────────────────────────────────────────────
async function loadMenu() {
  state.loading = true;
  state.error   = null;
  render();
  try {
    const res = await fetch('/api/menu');
    if (!res.ok) throw new Error('Server error ' + res.status);
    const data = await res.json();
    if (!data.days?.length) throw new Error("No menu data in this week's PDF.");
    state.days      = data.days;
    state.activeDay = todayIndex(data.days);
    const first = data.days[0], last = data.days[data.days.length-1];
    state.weekLabel = 'Week of ' + first.date + ' – ' + last.date.replace(/\w+ /, '');
    state.loading   = false;
    render();
    loadPhotos();
  } catch(err) {
    state.error   = err.message;
    state.loading = false;
    render();
  }
}

      r.comment));

async function loadReviews(station, description, listEl, avgEl) {
  const itemKey = station + '||' + (description || '');
  try {
    const snap = await db.collection('reviews')
      .where('itemKey', '==', itemKey)
      .get();
    const docs = [];
    snap.forEach(doc => docs.push(doc.data()));
    docs.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    listEl.innerHTML = '';
    if (!docs.length) {
      if (avgEl) avgEl.textContent = '';
      listEl.appendChild(el('div', { style:{ color:T.muted, fontSize:'0.82rem',
        fontStyle:'italic', padding:'10px 0', fontFamily:"'Playfair Display',serif" }},
        'No reviews yet — be the first!'));
      return;
    }
    let total = 0;
    docs.forEach(r => {
      total += r.rating;
      listEl.appendChild(buildReviewItem(r));
    });
    if (avgEl) avgEl.textContent =
      (total / docs.length).toFixed(1) + ' ★  ·  ' + docs.length + ' review' + (docs.length !== 1 ? 's' : '');
  } catch(err) {
    listEl.innerHTML = '';
    listEl.appendChild(el('div', { style:{ color:'#eb5757', fontSize:'0.8rem' }},
      'Could not load reviews.'));
  }
}

function buildReviewForm(station, description, listEl, avgEl) {
  const wrap = el('div', { style:{ marginTop:'20px', paddingTop:'20px', borderTop:`1px solid ${T.border}` }});
  wrap.appendChild(el('div', { style:{ fontSize:'0.65rem', fontWeight:'500', color:T.muted,
    textTransform:'uppercase', letterSpacing:'0.12em', marginBottom:'12px' }},
    'Leave a Review'));

  let selectedRating = 0;
  const starWrap = el('div', { style:{ display:'flex', gap:'4px', marginBottom:'12px' }});
  const stars = [];
  for (let i = 1; i <= 5; i++) {
    const idx = i;
    const star = el('span', { style:{
      fontSize:'1.6rem', cursor:'pointer', color:T.border,
      transition:'color 0.1s', userSelect:'none', lineHeight:'1',
    }}, '★');
    star.onclick = () => {
      selectedRating = idx;
      stars.forEach((s, j) => { s.style.color = j < idx ? T.accent : T.border; });
    };
    star.onmouseenter = () => {
      stars.forEach((s, j) => { s.style.color = j < idx ? T.accent : T.border; });
    };
    star.onmouseleave = () => {
      stars.forEach((s, j) => { s.style.color = j < selectedRating ? T.accent : T.border; });
    };
    stars.push(star);
    starWrap.appendChild(star);
  }
  wrap.appendChild(starWrap);

  const textarea = el('textarea', {
    style:{
      width:'100%', background:T.bg, border:`1px solid ${T.border}`,
      borderRadius:'8px', color:T.text, fontFamily:'inherit',
      fontSize:'0.85rem', padding:'10px 12px', resize:'none',
      outline:'none', lineHeight:'1.5', boxSizing:'border-box',
      marginBottom:'10px',
    },
    placeholder: 'Share your thoughts… (optional)',
    rows: '3',
  });
  wrap.appendChild(textarea);

  const errMsg = el('div', { style:{
    color:'#eb5757', fontSize:'0.78rem', marginBottom:'8px', display:'none',
  }}, '');

  const btn = el('button', {
    style:{
      padding:'8px 22px', borderRadius:'8px', background:T.accent,
      color:T.bg, border:'none', fontFamily:'inherit',
      fontSize:'0.82rem', fontWeight:'500', cursor:'pointer',
    },
    onclick: async () => {
      errMsg.style.display = 'none';
      if (!selectedRating) {
        errMsg.textContent = 'Please pick a star rating.';
        errMsg.style.display = 'block';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Submitting…';
      try {
        const itemKey = station + '||' + (description || '');
        await db.collection('reviews').add({
          station,
          itemKey,
          rating: selectedRating,
          comment: textarea.value.trim(),
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
        selectedRating = 0;
        stars.forEach(s => { s.style.color = T.border; });
        textarea.value = '';
        btn.disabled = false;
      btn.textContent = 'Submit';
      loadReviews(station, description, listEl, avgEl);
      loadAllRatings();
      } catch(e) {
        errMsg.textContent = 'Could not submit — please try again.';
        errMsg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Submit';
      }
    },
  }, 'Submit');

  wrap.appendChild(errMsg);
  wrap.appendChild(btn);
  return wrap;
}

// ── Load all ratings for card badges ─────────────────────────────────────────
async function loadAllRatings() {
  try {
    const day = state.days[state.activeDay];
    if (!day) return;
    const acc = {};
    for (const item of (day.items || [])) {
      const itemKey = item.station + '||' + (item.description || '');
      const snap = await db.collection('reviews').where('itemKey', '==', itemKey).get();
      let total = 0, count = 0;
      snap.forEach(doc => { total += doc.data().rating; count++; });
      if (count > 0) acc[item.station] = { avg: total / count, count };
    }
    state.ratings = acc;
    if (!state.loading) render();
  } catch(e) {}
}

// ── Boot ──────────────────────────────────────────────────────────────────────
setInterval(() => { state.status = getStatus(); render(); }, 60000);
loadMenu();
loadAllRatings();
</script>
